[project]
name = "klcn-2026-yolo-cbam-defect-detection"
version = "0.1.0"
description = "Ứng dụng YOLO11n kết hợp CBAM trong phát hiện khuyết tật sản phẩm công nghiệp trên MVTec AD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phạm Nguyễn Minh Hậu", email = "hau@example.com" },
    { name = "Phan Minh Trí", email = "tri@example.com" },
    { name = "Lê Thị Trà My", email = "my@example.com" },
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
