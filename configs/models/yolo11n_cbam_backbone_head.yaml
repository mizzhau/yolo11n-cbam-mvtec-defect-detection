# YOLO11n + CBAM@Backbone+Head Architecture Configuration
# Dual Attention:
#   - Backbone CBAM: Integrated at P3, P4, P5 of Backbone to refine feature extraction
#   - Head CBAM: Integrated immediately before Detection heads at P3, P4, P5 for task-specific prediction
# Dataset: MVTec AD 15 Categories / 48 Defect Types

nc: 48
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO11n backbone with CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, CBAM, []]                   # 5-CBAM @ P3 (Backbone P3)
  - [-1, 1, Conv, [512, 3, 2]]          # 6-P4/16
  - [-1, 2, C3k2, [512, True]]          # 7
  - [-1, 1, CBAM, []]                   # 8-CBAM @ P4 (Backbone P4)
  - [-1, 1, Conv, [1024, 3, 2]]         # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 10
  - [-1, 1, CBAM, []]                   # 11-CBAM @ P5 (Backbone P5)
  - [-1, 1, SPPF, [1024, 5]]            # 12
  - [-1, 2, C2PSA, [1024]]              # 13

# YOLO11n head with CBAM before Detect
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 8], 1, Concat, [1]]                   # 15 cat backbone P4 (layer 8 after CBAM)
  - [-1, 2, C3k2, [512, False]]                 # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 5], 1, Concat, [1]]                   # 18 cat backbone P3 (layer 5 after CBAM)
  - [-1, 2, C3k2, [256, False]]                 # 19 (P3/8-small)
  - [-1, 1, CBAM, []]                           # 20-CBAM @ Head P3 (ngay trước Detect P3)

  - [19, 1, Conv, [256, 3, 2]]                  # 21 downsample từ layer 19 sang P4
  - [[-1, 16], 1, Concat, [1]]                  # 22 cat head P4
  - [-1, 2, C3k2, [512, False]]                 # 23 (P4/16-medium)
  - [-1, 1, CBAM, []]                           # 24-CBAM @ Head P4 (ngay trước Detect P4)

  - [23, 1, Conv, [512, 3, 2]]                  # 25 downsample từ layer 23 sang P5
  - [[-1, 13], 1, Concat, [1]]                  # 26 cat head P5 (layer 13 after C2PSA)
  - [-1, 2, C3k2, [1024, True]]                 # 27 (P5/32-large)
  - [-1, 1, CBAM, []]                           # 28-CBAM @ Head P5 (ngay trước Detect P5)

  - [[20, 24, 28], 1, Detect, [nc]]             # 29 Detect(P3, P4, P5)
