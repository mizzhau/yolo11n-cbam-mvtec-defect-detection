# YOLO11n + CBAM@Neck+Head Architecture Configuration
# Dual Attention:
#   - Neck CBAM: Integrated at cross-scale fusion layers (FPN P4, PAN P4) to refine multi-scale feature propagation
#   - Head CBAM: Integrated immediately before Detection heads at P3, P4, P5 for task-specific refinement
# Dataset: MVTec AD 15 Categories / 48 Defect Types

nc: 48
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO11n backbone (giữ nguyên — không có CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# YOLO11n head with dual CBAM (Neck feature fusion + Head detection branches)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13 (FPN P4)
  - [-1, 1, CBAM, []]                           # 14-CBAM @ Neck FPN-P4 (Lọc & chọn lọc sau FPN P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]                   # 16 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 17 (P3/8-small)
  - [-1, 1, CBAM, []]                           # 18-CBAM @ Head P3 (Tinh chỉnh trước Detect P3 - Small)

  - [17, 1, Conv, [256, 3, 2]]                  # 19 downsample từ P3 sang PAN P4
  - [[-1, 14], 1, Concat, [1]]                  # 20 cat Neck FPN-P4 (layer 14 đã qua Neck CBAM)
  - [-1, 2, C3k2, [512, False]]                 # 21 (PAN P4)
  - [-1, 1, CBAM, []]                           # 22-CBAM @ Neck PAN-P4 (Chọn lọc trước khi downsample sang P5)

  - [-1, 1, Conv, [512, 3, 2]]                  # 23 downsample từ layer 22 sang PAN P5
  - [[-1, 10], 1, Concat, [1]]                  # 24 cat backbone P5 (layer 10)
  - [-1, 2, C3k2, [1024, True]]                 # 25 (PAN P5)

  - [21, 1, CBAM, []]                           # 26-CBAM @ Head P4 (Tinh chỉnh trước Detect P4 - Medium)
  - [25, 1, CBAM, []]                           # 27-CBAM @ Head P5 (Tinh chỉnh trước Detect P5 - Large)

  - [[18, 26, 27], 1, Detect, [nc]]             # 28 Detect(P3, P4, P5)
