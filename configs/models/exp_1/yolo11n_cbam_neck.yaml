# YOLO11n + CBAM@Neck Architecture Configuration
# CBAM integrated at P3, P4, P5 outputs of Neck (after FPN/PAN fusion)
# Dataset: MVTec AD 15 Categories / 48 Defect Types

nc: 48
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO11n backbone (giữ nguyên — không có CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]         # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]            # 9
  - [-1, 2, C2PSA, [1024]]              # 10

# YOLO11n head with CBAM after each FPN/PAN scale output
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13
  - [-1, 1, CBAM, []]                           # 14-CBAM @ Neck P4 (chọn lọc sau FPN P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]                   # 16 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 17 (P3/8-small)
  - [-1, 1, CBAM, []]                           # 18-CBAM @ Neck P3 (chọn lọc sau FPN P3)

  - [-1, 1, Conv, [256, 3, 2]]                  # 19
  - [[-1, 14], 1, Concat, [1]]                  # 20 cat Neck P4 (layer 14 after CBAM)
  - [-1, 2, C3k2, [512, False]]                 # 21 (P4/16-medium)
  - [-1, 1, CBAM, []]                           # 22-CBAM @ Neck P4-PAN (chọn lọc sau PAN P4)

  - [-1, 1, Conv, [512, 3, 2]]                  # 23
  - [[-1, 10], 1, Concat, [1]]                  # 24 cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                 # 25 (P5/32-large)
  - [-1, 1, CBAM, []]                           # 26-CBAM @ Neck P5-PAN (chọn lọc sau PAN P5)

  - [[18, 22, 26], 1, Detect, [nc]]             # 27 Detect(P3, P4, P5)
